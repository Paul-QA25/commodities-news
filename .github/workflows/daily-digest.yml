# Save as .github/workflows/daily-digest.yml
name: Daily News Digest

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 07:00 IST
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # required for the commit step below

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build digest
        run: python fetch_news_rss.py

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: news-digest-${{ github.run_number }}
          path: |
            news_digest_*.html
            news_digest_*.pdf
          if-no-files-found: warn
          retention-days: 30

      - name: Commit dedup state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_articles.json news_feed_log.jsonl
          # `git commit` exits 1 when there is nothing staged, which fails the
          # whole job on a quiet news day. Only commit if something changed.
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Digest state $(date -u +%Y-%m-%d)"
            git push
          fi
