# Save as .github/workflows/daily-digest.yml
name: Daily Commodities RSS Digest

on:
  schedule:
    # 03:30 UTC = 09:00 IST. Edit "37 3" (minute hour) to change the time.
    # Cron here is always UTC. An odd minute is deliberate: runs scheduled on
    # the hour and half-hour sit in the longest queues and get dropped most.
    - cron: "37 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The script now emails the digest itself: HTML in the body, PDF
      # attached only if it exists. That removes the missing-attachment
      # failure that was killing the old send-mail step.
      - name: Fetch feeds and email digest
        env:
          SMTP_USER: ${{ secrets.MAIL_USERNAME }}
          SMTP_PASS: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 fetch_news_rss.py

      # Keep a copy in the Actions run even if the commit step has trouble.
      - name: Upload digest as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: |
            news_digest_*.html
            news_digest_*.pdf
          if-no-files-found: warn
          retention-days: 30

      - name: Trim old digests
        run: |
          KEEP=30
          # `git rm` fails hard on files git has never tracked, so ignore
          # unmatched paths and delete from disk separately.
          OLD=$( { ls -1 news_digest_*.html news_digest_*.pdf 2>/dev/null || true; } \
                 | sort | head -n -"$((KEEP * 2))" )
          if [ -n "$OLD" ]; then
            git rm --ignore-unmatch -f $OLD || true
            rm -f $OLD
          fi
          git rm --ignore-unmatch -f commodities_digest_*.txt || true

      - name: Commit digest and state files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # --ignore-removal keeps this from failing when a glob matches nothing.
          git add -A news_digest_*.html news_digest_*.pdf \
                     news_feed_log.jsonl seen_articles.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Daily digest: $(date -u +'%Y-%m-%d')"
            git push
          fi
